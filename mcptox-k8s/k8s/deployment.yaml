apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcptox-wrapper
  labels:
    app.kubernetes.io/name: mcptox-wrapper
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: mcptox-wrapper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcptox-wrapper
    spec:
      containers:
        - name: wrapper
          image: nandogmarques/mcptox-wrapper:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tools
              mountPath: /config
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tools
          configMap:
            name: mcptox-tools
